name: Update Scores and Profiles

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download CSV
        run: |
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=858596898&single=true&output=csv" -o data/GOB.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=1591622822&single=true&output=csv" -o data/GOC.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=1364403981&single=true&output=csv" -o data/GODuo.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=835654147&single=true&output=csv" -o data/WVB.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=264943027&single=true&output=csv" -o data/WVC.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=1223456525&single=true&output=csv" -o data/WVDuo.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=1532429728&single=true&output=csv" -o data/EF.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=809837126&single=true&output=csv" -o data/GODub.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=168658244&single=true&output=csv" -o data/WVDub.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=1907063815&single=true&output=csv" -o data/GOVulc.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=1417918981&single=true&output=csv" -o data/WVVulc.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=1365879600&single=true&output=csv" -o data/GOBack.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=643381007&single=true&output=csv" -o data/WVBack.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=350720572&single=true&output=csv" -o data/GOSide.csv
          curl -L -v "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0H_MLczNIKoWQzA-Bx4hwSCrp-_2BTXAiMhDzWshOpDOnLeHsqqUo5mCfv28lDSwXvCe02qLx6E-s/pub?gid=653349176&single=true&output=csv" -o data/FB.csv
      
      - name: Combine GO
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
      
          data_dir = Path("data")
          output_path = data_dir / "GreenOrange.csv"
          rows = []
          output_header = None
      
          for filename, type_value in [("GOB.csv", "B"), ("GOC.csv", "C")]:
              with (data_dir / filename).open(
                  "r", newline="", encoding="utf-8-sig"
              ) as infile:
                  reader = csv.reader(infile)
                  header = next(reader, None)
      
                  if header is None:
                      continue
      
                  if output_header is None:
                      output_header = [header[0], "Type", *header[1:]]
      
                  for row in reader:
                      if row:
                          rows.append([row[0], type_value, *row[1:]])
      
          rows.sort(key=lambda row: int(row[2].replace(",", "")), reverse=True)
      
          with output_path.open("w", newline="", encoding="utf-8") as outfile:
              writer = csv.writer(outfile)
              if output_header:
                  writer.writerow(output_header)
              writer.writerows(rows)
          PY
          
      - name: Update Profiles
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          entries = {}
          split_files = {"goduo.csv", "wvduo.csv"}

          for path in sorted(Path("data").glob("*.csv")):
              with path.open(newline="", encoding="utf-8-sig") as f:
                  reader = csv.reader(f)
                  next(reader, None)  # Skip this CSV's header

                  for row in reader:
                      if not row or not row[0].strip():
                          continue

                      value = row[0].strip()
                      values = (
                          value.split("<br>")
                          if path.name.casefold() in split_files
                          else [value]
                      )

                      for item in values:
                          item = item.strip()
                          if item:
                              entries.setdefault(item.casefold(), item)

          output = Path("data/profiles.txt")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              "".join(
                  f"{entry}\n"
                  for entry in sorted(entries.values(), key=str.casefold)
              ),
              encoding="utf-8",
          )
          PY

      - name: Generate profile pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json
          import re
          import unicodedata
      
          source = Path("data/profiles.txt")
          output_dir = Path("_profiles")
      
          if not source.is_file():
              raise SystemExit(f"Missing input file: {source}")
      
          output_dir.mkdir(parents=True, exist_ok=True)
      
          def slugify(text):
              normalized = unicodedata.normalize("NFKD", text)
              ascii_text = normalized.encode("ascii", "ignore").decode("ascii")
              slug = re.sub(r"[^a-zA-Z0-9]+", "-", ascii_text).strip("-").lower()
      
              if slug:
                  return slug
      
              return quote(text, safe="")
      
          used_slugs = set()
      
          for line in source.read_text(encoding="utf-8").splitlines():
              name = line.strip()
              if not name:
                  continue
      
              base = slugify(name)
              slug = base
              number = 2
              while slug in used_slugs:
                  slug = f"{base}-{number}"
                  number += 1
              used_slugs.add(slug)
      
              title = json.dumps(name, ensure_ascii=False)
              page = output_dir / f"{slug}.md"
              page.write_text(
                  f"---\ntitle: {title}\n---\n\n# {name}\n",
                  encoding="utf-8",
              )
              print(f"Created {page}")
          PY
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/*.csv data/profiles.txt
            git commit -m "Update Scores"
            git push
          fi
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _profiles/
          git status --short
          git diff --cached --stat
          git commit -m "Generate profile pages" || echo "No changes to commit"
          git push
